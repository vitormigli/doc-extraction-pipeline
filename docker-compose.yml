services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./evals/dataset:/app/evals/dataset

  demo:
    build: .
    command: uv run streamlit run src/doc_extraction/streamlit_app.py --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - api
